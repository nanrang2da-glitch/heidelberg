<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>하이델베르크 요리문답 지도</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#f5f0e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161b" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="요리문답 지도">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* 홈 화면 앱(전체 화면)에서 노치·홈바를 피하도록 */
.top{padding-top:max(10px,env(safe-area-inset-top));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
#strip{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.zoom{right:max(12px,env(safe-area-inset-right))}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f0e6; --surface:#fffdf8; --surface-2:#efe8d9; --ink:#29251f; --muted:#6f665a; --line:#d8cdb9;
  --p0:#a8741a; --p1:#b23a48; --p2:#2f6aa8; --p3:#2c8156; --on-c:#fffdf8;
  --flow:#56677c; --echo:#7a4bcc; --contrast:#cf631a; --ring:#29251f;
  --shadow:0 1px 2px rgba(60,40,10,.08),0 4px 14px rgba(60,40,10,.06);
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --serif:"Noto Serif KR","Batang","AppleMyungjo",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#14161b; --surface:#1d2027; --surface-2:#262a33; --ink:#ece5d8; --muted:#a1988a; --line:#363b46;
  --p0:#e2ad4d; --p1:#ec7682; --p2:#6ea8e8; --p3:#62c28d; --on-c:#14161b;
  --flow:#93a4b9; --echo:#b392f6; --contrast:#f2964e; --ring:#ece5d8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14161b; --surface:#1d2027; --surface-2:#262a33; --ink:#ece5d8; --muted:#a1988a; --line:#363b46;
  --p0:#e2ad4d; --p1:#ec7682; --p2:#6ea8e8; --p3:#62c28d; --on-c:#14161b;
  --flow:#93a4b9; --echo:#b392f6; --contrast:#f2964e; --ring:#ece5d8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
html,body{height:100%}
body{display:grid;grid-template-rows:auto auto 1fr;overflow:hidden}
button{font:inherit;color:inherit}

/* header */
.top{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.brand h1{font-family:var(--serif);font-size:19px;margin:0;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.search{position:relative;flex:1;min-width:180px;max-width:360px}
.search input{width:100%;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.search input:focus{outline:2px solid var(--p2);outline-offset:1px}
#results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:20;max-height:60vh;overflow:auto;display:none}
#results.on{display:block}
#results button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
#results button:last-child{border-bottom:0}
#results button:hover,#results button.act{background:var(--surface-2)}
#results b{display:inline-block;min-width:44px;color:var(--muted);font-weight:600}
#results small{display:block;color:var(--muted);margin-left:44px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tools button{border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:999px;font-size:13px;cursor:pointer}
.tools button:hover{background:var(--surface-2)}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prog{font-size:12px;color:var(--muted);white-space:nowrap}

/* flow strip */
#strip{display:flex;gap:10px;padding:8px 16px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.seg{display:flex;flex-direction:column;gap:4px;min-width:0}
.seg .lab{font-size:11px;font-weight:700;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg .lab span{font-weight:500;color:var(--muted)}
.cells{display:flex;gap:2px;height:14px;align-items:center}
.cell{flex:1;min-width:3px;height:10px;border-radius:3px;border:0;padding:0;background:color-mix(in srgb,var(--c) 28%,var(--surface));cursor:pointer;transition:height .15s}
.cell:hover{height:14px}
.cell.done{background:var(--c)}
.cell.cur{height:14px;outline:2px solid var(--ring);outline-offset:1px}

/* main */
main{display:grid;grid-template-columns:1fr 410px;min-height:0}
#stage{position:relative;overflow:hidden;min-height:0;background:
  radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--line) 70%,transparent) 1px,transparent 0) 0 0/22px 22px}
#svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
#svg.drag{cursor:grabbing}
.node{cursor:pointer}
.node .pill{fill:color-mix(in srgb,var(--c) 9%,var(--surface));stroke:color-mix(in srgb,var(--c) 38%,var(--line));stroke-width:1}
.node:hover .pill{stroke:var(--c);stroke-width:1.5}
.node .stripe{fill:var(--c)}
.node text{fill:var(--ink);dominant-baseline:central}
.node .sub{fill:var(--muted);font-family:var(--sans);font-weight:500}
.node .tog circle{fill:var(--surface);stroke:color-mix(in srgb,var(--c) 50%,var(--line))}
.node .tog text{fill:var(--c);font-size:11px;font-weight:700;text-anchor:middle}
.t-part .pill,.t-root .pill{fill:var(--c);stroke:var(--c)}
.t-part text,.t-root text{fill:var(--on-c)}
.t-part .sub,.t-root .sub{fill:var(--on-c);opacity:.78}
.t-part .stripe,.t-root .stripe{display:none}
.t-part .tog circle,.t-root .tog circle{fill:var(--on-c);stroke:none}
.node.sel .pill{stroke:var(--ring);stroke-width:2.5}
.node .body{transition:opacity .25s}
.focus .node:not(.hl) .body{opacity:.4}
.node.match .pill{stroke:var(--contrast);stroke-width:2.5;stroke-dasharray:4 3}
.node .chk{display:none}
.node.done .chk{display:block}
.chk circle{fill:var(--c)} .chk path{stroke:var(--on-c);stroke-width:1.8;fill:none}
.tl{fill:none;stroke:color-mix(in srgb,var(--line) 85%,var(--muted));stroke-width:1.4}
.rel{fill:none;stroke-width:1.8;opacity:.9}
.rel.bg{opacity:.22}
.rel.f{stroke:var(--flow)} .rel.e{stroke:var(--echo);stroke-dasharray:6 4} .rel.c{stroke:var(--contrast);stroke-dasharray:2 4;stroke-linecap:round}
.relhit{fill:none;stroke:transparent;stroke-width:14;cursor:help}
.relhit:hover + .rel,.rel.hov{stroke-width:3.2;opacity:1}
.dot-f{fill:var(--flow)} .dot-e{fill:var(--echo)} .dot-c{fill:var(--contrast)}

.overlay{position:absolute;display:flex;gap:6px;pointer-events:none}
.overlay > *{pointer-events:auto}
.legend{left:12px;bottom:12px;flex-direction:column;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;gap:4px;box-shadow:var(--shadow)}
.legend div{display:flex;align-items:center;gap:8px}
.legend svg{width:30px;height:8px}
.legend .hint{color:var(--muted);font-size:11px;margin-top:2px}
.zoom{right:12px;bottom:12px;flex-direction:column}
.zoom button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;box-shadow:var(--shadow)}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.5;padding:8px 10px;border-radius:8px;max-width:320px;opacity:0;transition:opacity .12s;z-index:5}
#tip.on{opacity:1}
#tip b{font-weight:700}

/* panel */
#panel{border-left:1px solid var(--line);background:var(--surface);overflow:auto;min-height:0}
#pbody{padding:18px 20px 40px}
.grab{display:none}
.mini-legend{display:flex;flex-direction:column;gap:6px;font-size:13px;margin:6px 0}
.mini-legend div{display:flex;align-items:center;gap:8px}
.mini-legend svg{width:30px;height:8px;flex:none}
.crumb{display:flex;flex-wrap:wrap;gap:4px;font-size:12px;color:var(--muted);margin-bottom:10px}
.crumb button{border:0;background:none;padding:2px 4px;border-radius:6px;cursor:pointer;color:var(--muted)}
.crumb button:hover{background:var(--surface-2);color:var(--ink)}
.crumb i{font-style:normal;opacity:.5}
.ph{border-left:4px solid var(--c);padding-left:12px;margin-bottom:14px}
.ph .kick{font-size:12px;color:var(--c);font-weight:700;letter-spacing:.02em}
.ph h2{font-family:var(--serif);font-size:22px;margin:2px 0 4px;line-height:1.3;text-wrap:balance}
.ph p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 14px}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:999px;font-size:13px;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
label.btn input{margin:0;accent-color:var(--c)}
.qa{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;background:var(--bg)}
.qa.focusq{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.qa header{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.qa .qn{font-size:12px;font-weight:700;color:var(--on-c);background:var(--c);border-radius:999px;padding:1px 8px;flex:none}
.qa h4{margin:0;font-size:15px}
.qa .q{margin:0 0 8px;font-weight:600;line-height:1.6;font-size:14.5px}
.qa .ans{margin:0;line-height:1.75;font-size:14px;transition:filter .2s}
.qa .ans::before{content:"답 ";font-weight:700;color:var(--c)}
.memo .qa .ans{filter:blur(5px);cursor:pointer;user-select:none}
.memo .qa .ans.rev{filter:none}
.kw{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.kw span{font-size:11.5px;color:var(--muted);background:var(--surface-2);padding:2px 7px;border-radius:999px}
.refs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.refs .rl{font-size:11.5px;font-weight:700;color:var(--c);margin-right:2px}
.ref{border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));background:var(--surface);color:var(--ink);border-radius:6px;padding:1px 7px;font-size:12px;cursor:pointer;font-family:var(--serif)}
.ref:hover{background:color-mix(in srgb,var(--c) 12%,var(--surface))}
#refpop{position:fixed;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px}
#refpop[hidden]{display:none}
#refpop .rp-h{font-family:var(--serif);font-weight:700;font-size:14px;padding:6px 10px 4px}
#refpop .rp-h small{font-family:var(--sans);font-weight:500;color:var(--muted);font-size:11.5px;margin-left:4px}
#refpop .rp-v{font-family:var(--serif);font-size:14px;line-height:1.75;padding:2px 10px 8px;max-height:min(40vh,320px);overflow:auto;border-bottom:1px solid var(--line);margin-bottom:2px}
#refpop .rp-none{font-family:var(--sans);font-size:12.5px;color:var(--muted)}
.vbox{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;color:var(--muted)}
.vbox b{color:var(--ink)}
.vbox .row{margin:8px 0 0}
#vfile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#refpop sup,.vlist sup{font-size:10px;color:var(--muted);font-family:var(--sans);margin:0 2px 0 3px}
.ref-all{border:0;background:none;color:var(--c);font-size:12px;font-weight:700;cursor:pointer;padding:2px 6px;margin-left:auto}
.vlist{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--serif);font-size:14px;line-height:1.75}
.vlist[hidden]{display:none}
.vlist p{margin:0 0 8px}
.vlist p b{font-family:var(--sans);font-size:12.5px;color:var(--c);margin-right:2px}
.vlist .vsrc{display:block;text-align:right;color:var(--muted);font-family:var(--sans);font-size:11px}
#refpop .rp-i{display:block;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink);text-decoration:none;font-size:13.5px}
#refpop .rp-i:hover,#refpop .rp-i:focus-visible{background:var(--surface-2)}
#refpop .rp-i small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.rels{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.rels h5{margin:6px 0 0;font-size:12px;color:var(--muted);font-weight:600}
.rel-b{display:block;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;cursor:pointer;font-size:13px;line-height:1.5;border-left:4px solid var(--rc)}
.rel-b:hover{background:var(--surface-2)}
.rel-b b{color:var(--rc);font-size:11.5px;margin-right:4px}
.rel-b small{display:block;color:var(--muted);font-size:12px}
.r-f{--rc:var(--flow)} .r-e{--rc:var(--echo)} .r-c{--rc:var(--contrast)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{border:1px solid var(--line);border-left:3px solid var(--rc);background:var(--surface);border-radius:8px;padding:2px 8px;font-size:12px;cursor:pointer}
.chip:hover{background:var(--surface-2)}
.list{display:flex;flex-direction:column;gap:6px;margin:8px 0 16px}
.li{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;cursor:pointer;font-size:14px}
.li:hover{border-color:var(--c)}
.li .n{font-size:12px;color:var(--c);font-weight:700;min-width:52px}
.li .m{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.li.done .m::after{content:" ✓";color:var(--c);font-weight:700}
h3.sec{font-size:13px;color:var(--muted);margin:18px 0 6px;font-weight:700}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.pc{border:0;border-radius:14px;padding:12px;text-align:left;cursor:pointer;background:color-mix(in srgb,var(--c) 12%,var(--surface));border-top:4px solid var(--c)}
.pc:hover{background:color-mix(in srgb,var(--c) 20%,var(--surface))}
.pc b{display:block;font-family:var(--serif);font-size:16px;color:var(--c)}
.pc span{font-size:12px;color:var(--muted)}
.pc p{margin:6px 0 0;font-size:12.5px;line-height:1.5}
.flowline{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-family:var(--serif);font-size:15px;margin:8px 0}
.flowline span{padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);font-weight:700}
.howto{font-size:13px;line-height:1.8;color:var(--muted);padding-left:18px;margin:6px 0}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:22px;border-top:1px solid var(--line);padding-top:10px}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;margin:6px 0 2px;background:var(--surface-2)}
.bar i{display:block;background:var(--c)}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:16px}

/* 패드 가로 / 작은 노트북 */
@media (max-width:1180px){
  main{grid-template-columns:1fr 350px}
  .legend .hint{display:none}
  .parts{grid-template-columns:1fr}
}
/* 폰 · 패드 세로: 지도는 전체 화면, 설명은 아래 시트 */
@media (max-width:900px){
  .top{gap:8px;padding:8px 16px}
  .brand span{display:none}
  .brand h1{font-size:16px}
  .search{flex:1;max-width:none;min-width:0}
  .search input{padding:7px 10px;font-size:16px}
  .tools{margin-left:0;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tools::-webkit-scrollbar{display:none}
  .tools button{flex:none;padding:6px 11px}
  .prog{display:none}
  #strip{gap:5px;padding:6px 16px 8px}
  .seg .lab span{display:none}
  main{display:block;position:relative;min-height:0;overflow:hidden}
  #stage{position:absolute;inset:0}
  body[data-sheet="min"]{--sh:58px}
  body[data-sheet="mid"]{--sh:50%}
  body[data-sheet="max"]{--sh:calc(100% - 16px)}
  #panel{position:absolute;left:0;right:0;bottom:0;height:var(--sh);z-index:6;border-left:0;border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.14);display:flex;flex-direction:column;overflow:hidden;transition:height .28s cubic-bezier(.3,.7,.2,1)}
  #panel.dragging{transition:none}
  .grab{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 16px;min-height:58px;flex:none;touch-action:none;cursor:grab;position:relative;border-bottom:1px solid var(--line)}
  .grab .bar{position:absolute;top:6px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:var(--line)}
  #grabTitle{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:6px}
  #grabTitle small{font-weight:500;color:var(--muted);margin-left:6px}
  #sheetBtn{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px;cursor:pointer;margin-top:4px}
  #pbody{flex:1;overflow:auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .legend{display:none}
  .zoom{bottom:calc(var(--sh) + 12px);transition:bottom .28s}
  .ph h2{font-size:20px}
  .qa{padding:12px 14px}
  .rel-b,.li,.btn,.chip,.ref{min-height:36px}
  .chip,.ref{display:inline-flex;align-items:center}
}
@media (max-width:420px){
  .tools button{font-size:12.5px;padding:6px 9px}
}
</style>
<header class="top">
  <div class="brand"><h1>하이델베르크 요리문답</h1><span>52주일 · 129문답 흐름 지도</span></div>
  <div class="search"><input id="q" type="search" placeholder="검색 — 예: 위로, 60, 롬 8" autocomplete="off"><div id="results"></div></div>
  <div class="tools">
    <span class="prog" id="prog"></span>
    <button id="bRel" aria-pressed="false" title="모든 관계선을 흐리게 함께 보기">모든 관계</button>
    <button id="bMemo" aria-pressed="false" title="답을 가리고 눌러서 확인">암송 모드</button>
    <button id="bAll" title="모든 주일과 문답을 펼침">모두 펼치기</button>
    <button id="bFit" title="처음 화면으로">처음으로</button>
    <button id="bTheme" title="밝게/어둡게">◐</button>
  </div>
</header>
<nav id="strip" aria-label="52주일 흐름"></nav>
<main>
  <div id="stage">

[1,"유일한 위로","살아서나 죽어서나 당신의 유일한 위로는 무엇입니까?","나는 내 것이 아니라 몸도 영혼도 신실한 구주 예수 그리스도의 것이라는 사실입니다. 그분은 보혈로 내 죗값을 다 치르시고 마귀의 권세에서 해방하셨으며, 아버지의 뜻이 아니면 머리털 하나도 떨어지지 않게 지키시고, 성령으로 영생을 확신시키며 기꺼이 그분을 위해 살게 하십니다.",["위로","소속","대속","보호","성령"]],
[2,"알아야 할 세 가지","이 위로 가운데 복되게 살고 죽으려면 무엇을 알아야 합니까?","세 가지입니다. ① 나의 죄와 비참이 얼마나 큰가, ② 어떻게 그 모든 죄와 비참에서 구원받는가, ③ 그런 구원에 대해 하나님께 어떻게 감사해야 하는가.",["비참","구원","감사","구조"]],
[3,"비참을 아는 길: 율법","당신의 비참을 무엇으로 압니까?","하나님의 율법으로 압니다.",["율법","비참","거울"]],
[4,"율법의 요구: 사랑","하나님의 율법은 우리에게 무엇을 요구합니까?","그리스도께서 요약하신 대로, 마음과 목숨과 뜻과 힘을 다해 주 하나님을 사랑하고, 네 이웃을 네 몸같이 사랑하라는 것입니다.",["율법","하나님 사랑","이웃 사랑"]],
[5,"지킬 수 없는 나","당신은 이 모든 것을 완전히 지킬 수 있습니까?","아닙니다. 나는 본성적으로 하나님과 이웃을 미워하는 경향이 있습니다.",["본성","미움","무능"]],
[6,"선하게 창조된 사람","하나님께서 사람을 이렇게 악하고 패역하게 창조하셨습니까?","아닙니다. 하나님은 사람을 선하게, 자기 형상 곧 참된 의와 거룩함으로 지으셔서 하나님을 바르게 알고 마음으로 사랑하며 영원한 복락 가운데 함께 살면서 찬양하게 하셨습니다.",["창조","하나님의 형상","의와 거룩"]],
[7,"부패의 기원: 타락","그렇다면 사람의 부패한 본성은 어디에서 왔습니까?","낙원에서 우리 첫 조상 아담과 하와가 타락하여 불순종한 데서 왔습니다. 그로 인해 우리 본성이 부패하여 모두 죄 가운데 잉태되고 태어납니다.",["타락","원죄","아담"]],
[8,"전적 부패","우리는 선은 전혀 행할 수 없고 모든 악으로 기울어질 만큼 부패했습니까?","그렇습니다. 하나님의 성령으로 거듭나지 않는 한 그렇습니다.",["전적 부패","중생","성령"]],
[9,"하나님은 불의하신가","사람이 행할 수 없는 것을 율법으로 요구하시니 하나님은 불의하신 것 아닙니까?","아닙니다. 하나님은 사람이 율법을 행할 수 있도록 지으셨으나, 사람이 마귀의 꾐에 빠져 고의로 불순종하여 그 능력을 스스로 잃어버렸습니다.",["하나님의 의","책임","불순종"]],
[10,"죄에 대한 심판","하나님은 그런 불순종과 반역을 벌하지 않고 두십니까?","결코 아닙니다. 하나님은 타고난 죄와 우리가 짓는 죄 모두에 대해 크게 진노하시며, 의로운 심판으로 지금과 영원히 벌하십니다.",["진노","심판","형벌"]],
[11,"공의와 자비","하나님은 자비로우신 분이 아닙니까?","하나님은 참으로 자비로우시지만 또한 공의로우십니다. 지극히 높으신 하나님의 위엄을 거스른 죄는 몸과 영혼의 영원한 형벌로 갚아야 한다고 그분의 공의가 요구합니다.",["공의","자비","영원한 형벌"]],
[12,"공의의 만족이 필요","형벌을 피하고 다시 은혜를 얻으려면 어떻게 해야 합니까?","하나님은 자신의 공의가 만족되기를 원하십니다. 그러므로 우리 자신이든 다른 이를 통해서든 그 값을 완전히 치러야 합니다.",["만족","속상","공의"]],
[13,"스스로 갚을 수 없음","우리 스스로 그 값을 치를 수 있습니까?","결코 없습니다. 오히려 날마다 죄의 빚을 더해 갑니다.",["무능","빚"]],
[14,"피조물도 할 수 없음","어떤 피조물이 우리 대신 값을 치를 수 있습니까?","없습니다. 하나님은 사람이 지은 죄를 다른 피조물에게 벌하지 않으시며, 어떤 피조물도 죄에 대한 하나님의 영원한 진노를 감당할 수 없습니다.",["피조물","진노"]],
[15,"어떤 중보자인가","그렇다면 어떤 중보자와 구원자를 찾아야 합니까?","참 사람이며 의로운 사람이면서, 동시에 모든 피조물보다 능력이 뛰어난 분, 곧 참 하나님이신 분입니다.",["중보자","참 사람","참 하나님"]],
[16,"왜 참 사람인가","중보자는 왜 참 사람이며 의로운 사람이어야 합니까?","죄를 지은 인간의 본성이 그 값을 치러야 하는 것이 하나님의 공의이기 때문이며, 자신이 죄인인 사람은 남의 죗값을 치를 수 없기 때문입니다.",["참 사람","의로움","대신"]],
[17,"왜 참 하나님인가","중보자는 왜 동시에 참 하나님이어야 합니까?","신성의 능력으로 하나님의 진노의 짐을 인성에 짊어지시고, 우리에게 의와 생명을 얻어 회복해 주시기 위해서입니다.",["참 하나님","진노","의와 생명"]],
[18,"중보자 예수 그리스도","참 하나님이시며 참 의로운 사람이신 그 중보자는 누구십니까?","우리 주 예수 그리스도이십니다. 그분은 우리의 완전한 구속과 의를 위해 우리에게 주어지셨습니다.",["예수 그리스도","구속"]],
[19,"복음으로 앎","당신은 그것을 어디에서 압니까?","거룩한 복음에서 압니다. 하나님은 복음을 낙원에서 처음 계시하시고, 족장과 선지자들로 전파하시며, 제사와 율법의 의식으로 예표하시고, 마침내 독생자 안에서 성취하셨습니다.",["복음","계시","예표"]],
[20,"누가 구원받는가","아담 안에서 멸망한 모든 사람이 그리스도로 말미암아 구원받습니까?","아닙니다. 참된 믿음으로 그리스도께 접붙여져 그분의 모든 은덕을 받아들이는 사람만 구원받습니다.",["믿음","접붙임","은덕"]],
[21,"참된 믿음","참된 믿음이란 무엇입니까?","하나님께서 말씀으로 계시하신 모든 것을 참되다고 여기는 확실한 지식이며, 동시에 오직 은혜로 그리스도의 공로 때문에 죄 사함과 영원한 의와 구원이 나에게도 주어졌다는 굳은 신뢰입니다. 성령께서 복음으로 내 마음에 일으키십니다.",["믿음","지식","신뢰","성령"]],
[22,"믿어야 할 내용","그리스도인은 무엇을 믿어야 합니까?","복음에 약속된 모든 것입니다. 우리의 보편적이고 의심할 여지 없는 기독교 신앙의 조항, 곧 사도신경이 그것을 요약해 가르칩니다.",["복음","사도신경"]],
[23,"사도신경","그 신앙의 조항은 무엇입니까?","사도신경입니다. 성부 하나님과 창조, 성자 예수 그리스도의 잉태·고난·죽음·부활·승천·재림, 성령, 거룩한 공교회와 성도의 교제, 죄 용서, 몸의 부활과 영생을 고백합니다.",["사도신경","고백"]],
[24,"신경의 세 부분","이 조항들은 어떻게 나뉩니까?","세 부분입니다. 성부 하나님과 우리의 창조, 성자 하나님과 우리의 구속, 성령 하나님과 우리의 성화입니다.",["삼위","창조","구속","성화"]],
[25,"삼위일체","하나님은 한 분이신데 왜 성부·성자·성령을 말합니까?","하나님께서 말씀에서 그렇게 계시하셨기 때문입니다. 구별되는 세 위격이 한 분이시며 참되고 영원한 하나님이십니다.",["삼위일체","계시"]],
[26,"창조주 아버지","'전능하신 아버지 하나님, 천지의 창조주를 믿습니다'는 무슨 뜻입니까?","무에서 천지를 창조하시고 섭리로 붙드시는 영원하신 아버지께서 그리스도 때문에 나의 하나님, 나의 아버지가 되심을 믿는 것입니다. 그분은 몸과 영혼에 필요한 모든 것을 주시고, 이 세상에서 겪는 어떤 악도 나에게 유익하게 하실 것을 신뢰합니다.",["창조","아버지","신뢰"]],
[27,"섭리","하나님의 섭리란 무엇입니까?","하나님의 전능하고 언제나 함께하는 능력입니다. 그 능력으로 하늘과 땅과 모든 피조물을 붙드시고 다스리시므로, 잎사귀와 풀, 비와 가뭄, 풍년과 흉년, 건강과 질병, 부와 가난이 우연이 아니라 아버지의 손에서 옵니다.",["섭리","아버지의 손"]],
[28,"섭리를 아는 유익","창조와 섭리를 알면 어떤 유익이 있습니까?","역경 중에는 인내하고, 형통할 때는 감사하며, 장래 일은 신실하신 아버지를 굳게 신뢰하게 됩니다. 어떤 피조물도 우리를 그분의 사랑에서 끊을 수 없기 때문입니다.",["인내","감사","신뢰"]],
[29,"예수: 구원자","하나님의 아들을 왜 '예수', 곧 구원자라 부릅니까?","그분이 우리를 죄에서 구원하시기 때문이며, 다른 누구에게서도 구원을 찾을 수 없고 찾아서도 안 되기 때문입니다.",["예수","구원자","유일성"]],
[30,"다른 구원자는 없다","성인이나 자기 자신 등에게서 구원을 찾는 사람도 유일한 구원자 예수를 믿는 것입니까?","아닙니다. 그들은 말로는 예수를 자랑해도 행위로는 그분을 부인합니다. 예수는 완전한 구원자이시든지 아니시든지 둘 중 하나입니다.",["유일한 구주","우상"]],
[31,"그리스도: 삼중직","그분을 왜 '그리스도', 곧 기름 부음 받은 자라 부릅니까?","성부께 임명받고 성령으로 기름 부음 받아, 우리의 큰 선지자(하나님의 뜻을 계시), 유일한 대제사장(단번의 희생과 중보), 영원한 왕(말씀과 성령으로 다스리고 지키심)이 되셨기 때문입니다.",["선지자","제사장","왕"]],
[32,"그리스도인","당신은 왜 그리스도인이라 불립니까?","믿음으로 그리스도의 지체가 되어 그분의 기름 부음에 참여하기 때문입니다. 그분의 이름을 고백하고(선지자), 나를 감사의 산 제물로 드리며(제사장), 이 세상에서 죄와 마귀와 싸우고 영원히 그분과 함께 다스립니다(왕).",["그리스도인","기름 부음","삼중직"]],
[33,"독생자","우리도 하나님의 자녀인데 왜 그분을 '독생자'라 부릅니까?","그리스도만이 영원하고 본래적인 하나님의 아들이시며, 우리는 그분 때문에 은혜로 입양된 하나님의 자녀이기 때문입니다.",["독생자","입양"]],
[34,"우리 주","왜 그분을 '우리 주'라 부릅니까?","금이나 은이 아니라 자신의 보혈로 우리 몸과 영혼을 죄와 마귀의 권세에서 구속하여 자기 소유로 삼으셨기 때문입니다.",["주","소유","구속"]],
[35,"성령으로 잉태·동정녀 탄생","'성령으로 잉태되어 동정녀 마리아에게서 나시고'는 무슨 뜻입니까?","영원한 하나님의 아들이 성령의 역사로 동정녀 마리아의 혈육에서 참 인성을 취하셔서, 죄는 없으시나 모든 면에서 형제들과 같은 다윗의 참 자손이 되셨다는 뜻입니다.",["성육신","참 인성","무죄"]],
[36,"잉태·탄생의 유익","그리스도의 거룩한 잉태와 탄생은 어떤 유익을 줍니까?","그분이 우리의 중보자가 되시고, 그분의 무죄함과 온전한 거룩으로 내가 잉태되고 태어날 때부터 지닌 죄를 하나님 앞에서 덮어 주십니다.",["중보자","덮음"]],
[37,"고난을 받으사","'고난을 받으사'는 무슨 뜻입니까?","그리스도께서 이 땅에 사시는 동안, 특히 생애 마지막에, 온 인류의 죄에 대한 하나님의 진노를 몸과 영혼으로 짊어지셨다는 뜻입니다. 유일한 속죄 제물로서 우리를 영원한 저주에서 구원하고 은혜와 의와 영생을 얻게 하시려는 것입니다.",["고난","진노","속죄 제물"]],
[38,"본디오 빌라도에게","왜 재판관 '본디오 빌라도'에게 고난을 받으셨습니까?","죄 없으신 분이 세상 재판관에게 정죄받으심으로, 우리가 받아야 할 하나님의 엄한 심판에서 우리를 해방하시기 위해서입니다.",["정죄","대신","해방"]],
[39,"십자가에 못 박히심","다른 죽음이 아니라 '십자가에 못 박히신' 것에 특별한 의미가 있습니까?","그렇습니다. 십자가의 죽음은 하나님께 저주받은 것이므로, 나에게 놓인 저주를 그분이 대신 짊어지셨음을 확신하게 됩니다.",["십자가","저주","대신"]],
[40,"죽으심","그리스도는 왜 죽기까지 낮아지셔야 했습니까?","하나님의 공의와 진실 때문에, 우리 죗값은 하나님의 아들의 죽음 외에는 달리 치를 수 없었기 때문입니다.",["죽음","공의","진실"]],
[41,"장사되심","왜 '장사되셨다'고 고백합니까?","그분이 참으로 죽으셨음을 증언하기 위해서입니다.",["장사","참 죽음"]],
[42,"신자는 왜 죽는가","그리스도께서 우리 대신 죽으셨는데 왜 우리도 죽어야 합니까?","우리의 죽음은 죗값을 치르는 것이 아니라 죄짓는 것을 그치고 영생으로 들어가는 관문입니다.",["신자의 죽음","영생의 관문"]],
[43,"십자가의 또 다른 유익","십자가의 희생과 죽음에서 우리가 받는 또 다른 유익은 무엇입니까?","그분의 능력으로 우리의 옛 사람이 함께 십자가에 못 박혀 죽고 장사되어, 육신의 악한 정욕이 더는 우리를 다스리지 못하고 우리 자신을 감사의 제물로 드리게 됩니다.",["옛 사람","성화","감사의 제물"]],
[44,"지옥에 내려가심","왜 '지옥에 내려가셨다'가 덧붙여져 있습니까?","가장 큰 시련 중에도, 그리스도께서 특히 십자가에서 영혼으로 말할 수 없는 고통을 당하심으로 나를 지옥의 고통에서 구원하셨다는 것을 확신하게 하려는 것입니다.",["지옥 강하","시련","확신"]],
[45,"부활의 유익","그리스도의 부활은 어떤 유익을 줍니까?","① 죽음을 이기시고 우리를 그분이 얻으신 의에 참여하게 하십니다. ② 그분의 능력으로 지금 우리를 새 생명으로 일으키십니다. ③ 우리의 영광스러운 부활의 확실한 보증입니다.",["부활","칭의","새 생명","보증"]],
[46,"하늘에 오르심","'하늘에 오르셨다'는 무슨 뜻입니까?","그리스도께서 제자들이 보는 앞에서 하늘로 오르셨고, 산 자와 죽은 자를 심판하러 다시 오실 때까지 우리의 유익을 위해 거기 계신다는 뜻입니다.",["승천"]],
[47,"그리스도는 함께 계신가","그렇다면 세상 끝날까지 함께하시겠다는 약속은 어떻게 됩니까?","그리스도는 참 하나님이시며 참 사람이십니다. 인성으로는 지금 땅에 계시지 않지만, 신성과 위엄과 은혜와 성령으로는 한순간도 우리를 떠나지 않으십니다.",["임재","신성","인성"]],
[48,"두 본성의 연합","인성이 있지 않은 곳에 신성이 있다면 두 본성이 나뉘는 것 아닙니까?","아닙니다. 신성은 어디에나 계시므로 취하신 인성의 경계를 넘어 계시지만, 동시에 인성 안에도 계시며 그것과 인격적으로 하나로 연합되어 있습니다.",["두 본성","인격적 연합"]],
[49,"승천의 유익","그리스도의 승천은 어떤 유익을 줍니까?","① 하늘에서 아버지 앞에 우리의 변호자가 되십니다. ② 머리이신 그분이 지체인 우리를 데려가실 확실한 보증으로 우리 육체가 하늘에 있습니다. ③ 보증으로 성령을 보내 주셔서 위의 것을 찾게 하십니다.",["변호자","보증","성령"]],
[50,"하나님 우편에 앉으심","'하나님 우편에 앉으셨다'는 왜 덧붙여 있습니까?","그리스도께서 교회의 머리로 자신을 나타내시려고 하늘에 오르셨고, 성부께서 그분을 통해 만물을 다스리시기 때문입니다.",["다스리심","교회의 머리"]],
[51,"높아지신 그리스도의 유익","영광중에 계신 그리스도는 어떤 유익을 주십니까?","성령으로 지체인 우리에게 하늘의 은사를 부어 주시고, 그분의 능력으로 모든 원수에게서 우리를 보호하고 지키십니다.",["은사","보호"]],
[52,"재림의 위로","'산 자와 죽은 자를 심판하러 오심'은 어떤 위로를 줍니까?","어떤 슬픔과 핍박 중에도 머리를 들고, 전에 나를 위해 하나님의 심판대에 서서 저주를 제거하신 바로 그분이 심판자로 오시기를 기다립니다. 그분은 원수들은 정죄하시고, 나는 모든 택한 자들과 함께 하늘의 기쁨과 영광으로 이끄실 것입니다.",["재림","위로","심판"]],
[53,"성령을 믿음","'성령을 믿습니다'는 무엇을 믿는 것입니까?","성령은 성부·성자와 함께 영원한 참 하나님이시며, 나에게도 주어지셔서 참 믿음으로 그리스도와 그분의 모든 은덕에 참여하게 하시고, 나를 위로하시며 영원히 함께하신다는 것입니다.",["성령","하나님","위로"]],
[54,"거룩한 공교회","'거룩한 공교회'에 대해 무엇을 믿습니까?","하나님의 아들이 세상의 처음부터 끝까지 온 인류 가운데서 영생을 위해 택하신 교회를 말씀과 성령으로 참 믿음 안에서 모으고 보호하고 보존하심을 믿습니다. 그리고 나도 그 교회의 살아 있는 지체이며 영원히 그러할 것을 믿습니다.",["교회","선택","지체"]],
[55,"성도의 교제","'성도의 교제'란 무엇입니까?","① 모든 신자가 지체로서 주 그리스도와 그분의 모든 보화와 은사에 참여한다는 것, ② 각자 받은 은사를 다른 지체의 유익과 구원을 위해 기꺼이 사용할 의무가 있다는 것입니다.",["성도의 교제","은사","섬김"]],
[56,"죄를 용서받음","'죄를 용서받는 것'에 대해 무엇을 믿습니까?","그리스도의 속죄 때문에 하나님께서 나의 모든 죄와 평생 싸워야 할 죄의 본성을 더 이상 기억하지 않으시고, 은혜로 그리스도의 의를 주셔서 다시는 정죄받지 않게 하신다는 것입니다.",["죄 용서","은혜","의"]],
[57,"몸의 부활","'몸의 부활'은 어떤 위로를 줍니까?","이 생명이 끝나면 즉시 내 영혼이 머리이신 그리스도께 올라가고, 내 몸도 그리스도의 능력으로 다시 살아나 영혼과 결합하여 그리스도의 영광스러운 몸과 같아진다는 것입니다.",["부활","영혼","위로"]],
[58,"영원한 생명","'영원한 생명'은 어떤 위로를 줍니까?","지금 이미 영원한 기쁨의 시작을 마음으로 누리며, 이 생명 후에는 눈으로 보지 못하고 귀로 듣지 못한 완전한 복을 누리고 하나님을 영원히 찬양하게 됩니다.",["영생","기쁨","찬양"]],
[59,"믿음의 유익","이 모든 것을 믿으면 어떤 유익이 있습니까?","그리스도 안에서 하나님 앞에 의롭게 되고 영생의 상속자가 됩니다.",["칭의","상속자"]],
[60,"오직 믿음으로 의롭게","당신은 어떻게 하나님 앞에서 의롭게 됩니까?","오직 예수 그리스도를 참으로 믿음으로써입니다. 내가 모든 계명을 어겼고 여전히 악으로 기울어져 있어도, 하나님은 내 공로 없이 순전히 은혜로 그리스도의 완전한 만족과 의와 거룩을 내 것으로 여겨 주십니다. 마치 내가 죄를 지은 적이 없고 그리스도의 순종을 내가 다 이룬 것처럼 여기시니, 나는 믿는 마음으로 받기만 하면 됩니다.",["칭의","오직 믿음","전가","은혜"]],
[61,"왜 오직 믿음인가","왜 오직 믿음으로만 의롭게 된다고 합니까?","내 믿음에 무슨 가치가 있어서가 아닙니다. 그리스도의 만족과 의와 거룩만이 하나님 앞에서 나의 의이며, 나는 오직 믿음으로만 그것을 받아 내 것으로 삼을 수 있기 때문입니다.",["오직 믿음","수단"]],
[62,"선행은 의가 될 수 없음","우리의 선행은 왜 하나님 앞에서 의가 될 수 없습니까?","하나님의 심판을 견딜 의는 율법에 완전히 일치해야 하는데, 이 생에서 우리의 가장 선한 행위도 불완전하며 죄로 더럽혀져 있기 때문입니다.",["선행","불완전"]],
[63,"상급은 은혜","하나님이 이 생과 내생에 선행에 상을 주시는데 그것이 공로가 아닙니까?","그 상은 공로로 받는 것이 아니라 은혜로 주시는 것입니다.",["상급","은혜"]],
[64,"방종하게 하지 않음","이런 가르침은 사람을 부주의하고 악하게 만들지 않습니까?","아닙니다. 참된 믿음으로 그리스도께 접붙여진 사람이 감사의 열매를 맺지 않는 것은 불가능합니다.",["감사의 열매","접붙임"]],
[65,"믿음의 출처","오직 믿음으로 그리스도와 은덕에 참여한다면 그 믿음은 어디서 옵니까?","성령께서 거룩한 복음의 설교로 우리 마음에 믿음을 일으키시고, 성례의 시행으로 그것을 확증하십니다.",["믿음","설교","성례","성령"]],
[66,"성례란","성례란 무엇입니까?","하나님께서 제정하신 눈에 보이는 거룩한 표와 인입니다. 그것을 시행할 때 복음의 약속, 곧 십자가에서 이루신 그리스도의 단번 제사 때문에 죄 사함과 영생을 은혜로 주신다는 약속을 더 잘 깨닫게 하시고 확증하십니다.",["성례","표","인"]],
[67,"말씀과 성례의 초점","말씀과 성례는 모두 무엇을 향하게 합니까?","그렇습니다. 둘 다 우리 믿음을 우리 구원의 유일한 근거인 십자가 위 그리스도의 단번 제사로 향하게 합니다.",["단번 제사","십자가"]],
[68,"두 성례","그리스도께서 신약에 제정하신 성례는 몇 가지입니까?","두 가지, 곧 거룩한 세례와 성찬입니다.",["세례","성찬"]],
[69,"세례의 의미","세례는 그리스도의 단번 제사가 당신에게 유익함을 어떻게 확증합니까?","물로 몸의 더러움을 씻듯, 그리스도의 피와 성령으로 내 영혼의 모든 죄가 확실히 씻긴다고 그리스도께서 명하시고 약속하셨습니다.",["세례","씻음","약속"]],
[70,"피와 성령으로 씻음","그리스도의 피와 성령으로 씻긴다는 것은 무엇입니까?","피로 씻김은 그리스도의 제사로 인해 은혜로 죄 사함을 받는 것이고, 성령으로 씻김은 성령으로 새롭게 되어 그리스도의 지체로 거룩해져 가는 것입니다.",["칭의","성화"]],
[71,"세례의 약속","그 약속은 어디에 있습니까?","세례를 제정하신 말씀(마 28:19; 막 16:16)에 있으며, 성경이 세례를 '중생의 씻음', '죄를 씻는 것'이라 부르는 데서도 거듭 나타납니다.",["제정의 말씀"]],
[72,"물이 씻는가","물로 씻는 그 자체가 죄를 씻습니까?","아닙니다. 오직 예수 그리스도의 피와 성령만이 우리를 모든 죄에서 깨끗하게 합니다.",["물","피","성령"]],
[73,"중생의 씻음이라 부르는 이유","그런데 왜 성령께서 세례를 '중생의 씻음'이라 부르십니까?","물이 몸을 씻듯 그리스도의 피와 성령이 죄를 없앤다는 것을 가르치시고, 나아가 이 신적 보증과 표로 우리가 실제로 영적으로 씻긴다는 것을 확신시키려 하시기 때문입니다.",["표와 실체","보증"]],
[74,"유아세례","유아에게도 세례를 주어야 합니까?","그렇습니다. 유아도 어른과 마찬가지로 하나님의 언약과 교회에 속하고, 그리스도의 피로 인한 죄 사함과 믿음을 일으키시는 성령이 약속되었습니다. 그러므로 언약의 표인 세례로 교회에 접붙여지고 불신자의 자녀와 구별되어야 합니다. 구약의 할례를 대신하는 것입니다.",["유아세례","언약","할례"]],
[75,"성찬의 의미","성찬은 그리스도의 단번 제사와 모든 은덕에 참여함을 어떻게 확증합니까?","떡을 떼어 먹고 잔을 마시라 명하시며 약속하셨습니다. 내 눈으로 떡이 떼어지고 잔이 나눠지는 것을 보듯 그분의 몸이 나를 위해 찢기고 피가 흘려졌으며, 떡과 잔을 받아먹듯 그분이 십자가의 몸과 피로 내 영혼을 영생으로 먹이신다는 것입니다.",["성찬","먹임","약속"]],
[76,"먹고 마신다는 것","그리스도의 몸을 먹고 피를 마신다는 것은 무엇입니까?","믿는 마음으로 그리스도의 고난과 죽음을 받아들여 죄 사함과 영생을 얻는 것이며, 또한 성령으로 그분의 거룩한 몸에 더욱 연합되어, 그분은 하늘에 우리는 땅에 있어도 그분의 살 중의 살, 뼈 중의 뼈가 되는 것입니다.",["연합","성령","믿음"]],
[77,"성찬의 약속","그 약속은 어디에 있습니까?","성찬을 제정하신 말씀(고전 11:23-26)에 있으며, 사도 바울이 그 약속을 반복합니다(고전 10:16-17).",["제정의 말씀"]],
[78,"떡이 몸으로 변하는가","떡과 포도주가 그리스도의 실제 몸과 피로 변합니까?","아닙니다. 세례의 물이 그리스도의 피로 변하거나 죄를 씻는 것이 아니라 하나님의 표와 보증이듯, 성찬의 떡도 그리스도의 몸으로 변하지 않고 성례의 성격과 용례에 따라 그리스도의 몸이라 불립니다.",["화체설 거부","표"]],
[79,"몸과 피라 부르는 이유","그렇다면 왜 떡을 그분의 몸, 잔을 그분의 피라 부르십니까?","떡과 포도주가 육신의 생명을 유지하듯 그분의 십자가의 몸과 피가 영혼의 참된 양식임을 가르치시고, 나아가 우리가 성령의 역사로 그분의 참 몸과 피에 참여하며 그분의 고난과 순종이 우리 것임을 확신시키려 하시기 때문입니다.",["영혼의 양식","확신"]],
[80,"성찬과 미사","주의 성찬과 교황청의 미사는 어떻게 다릅니까?","성찬은 그리스도께서 단번에 드리신 제사로 우리 모든 죄가 완전히 용서되었고 성령으로 그분과 연합됨을 증언합니다. 미사는 사제가 날마다 그리스도를 제물로 드려야 산 자와 죽은 자의 죄가 사해진다고 하며, 떡 속에 계신 그리스도를 경배하게 합니다. 그러므로 미사는 그리스도의 유일한 제사와 고난을 부인하는 것입니다.",["미사","단번 제사"]],
[81,"누가 참여하는가","누가 주의 상에 나아가야 합니까?","자기 죄 때문에 스스로를 미워하면서도 그리스도의 고난과 죽음으로 용서받았음을 믿고, 믿음이 더 강해지고 삶이 거룩해지기를 간절히 원하는 사람입니다. 위선자와 회개하지 않는 사람은 자기의 심판을 먹고 마십니다.",["참여 자격","회개"]],
[82,"불신자도 참여하는가","고백과 삶으로 불신앙을 드러내는 자도 성찬에 참여할 수 있습니까?","아닙니다. 그러면 하나님의 언약이 더럽혀지고 온 회중에 진노가 임합니다. 그러므로 교회는 그리스도의 명령에 따라 천국 열쇠로 그들이 삶을 고칠 때까지 제외해야 합니다.",["언약","천국 열쇠"]],
[83,"천국 열쇠","천국 열쇠란 무엇입니까?","거룩한 복음의 설교와 교회의 권징입니다. 이 둘로 신자에게는 천국이 열리고 불신자에게는 닫힙니다.",["설교","권징"]],
[84,"복음 설교로 열고 닫음","복음 설교로 천국이 어떻게 열리고 닫힙니까?","신자가 복음의 약속을 참 믿음으로 받아들일 때마다 그리스도의 공로로 모든 죄가 사해진다고 선포하고, 불신자와 위선자에게는 회개하지 않는 한 하나님의 진노가 머문다고 선포함으로써입니다.",["설교","선포"]],
[85,"권징으로 열고 닫음","교회의 권징으로 천국이 어떻게 열리고 닫힙니까?","그리스도인이라 하면서 교리나 삶이 그릇된 사람을 거듭 형제로 권면하고, 그래도 돌이키지 않으면 교회에 알려 성례에서 제외합니다. 그가 참으로 회개하면 다시 그리스도와 교회의 지체로 받아들입니다.",["권징","회개","회복"]],
[86,"왜 선을 행하는가","공로 없이 은혜로 구원받았는데 왜 선을 행해야 합니까?","그리스도께서 보혈로 우리를 구속하신 후 성령으로 새롭게 하셔서, 우리가 온 삶으로 은혜에 감사하고 하나님을 찬양하게 하시려는 것입니다. 또한 열매로 믿음을 확신하고, 경건한 삶으로 이웃을 그리스도께 얻기 위해서입니다.",["감사","선행","확신","전도"]],
[87,"회개 없는 구원은 없다","감사하지 않고 회개하지 않는 악한 삶을 사는 사람도 구원받을 수 있습니까?","결코 그럴 수 없습니다. 성경은 음행하는 자, 우상 숭배하는 자, 간음하는 자, 도둑질하는 자 등은 하나님 나라를 유업으로 받지 못한다고 말합니다.",["회개","하나님 나라"]],
[88,"참된 회개","참된 회개는 무엇으로 이루어집니까?","옛 사람이 죽고 새 사람이 살아나는 것입니다.",["회개","옛 사람","새 사람"]],
[89,"옛 사람의 죽음","옛 사람이 죽는다는 것은 무엇입니까?","죄 때문에 진심으로 슬퍼하고, 죄를 점점 더 미워하며 피하는 것입니다.",["죽임","슬픔"]],
[90,"새 사람의 살아남","새 사람이 살아난다는 것은 무엇입니까?","그리스도로 말미암아 하나님 안에서 진심으로 기뻐하고, 모든 선한 일에서 하나님의 뜻을 따라 사는 것을 사랑하고 기뻐하는 것입니다.",["살림","기쁨"]],
[91,"선행이란","선행이란 무엇입니까?","참된 믿음에서 나와, 하나님의 율법에 따라, 하나님의 영광을 위해 행한 것입니다. 우리의 생각이나 사람의 전통에 근거한 것이 아닙니다.",["선행","믿음","율법","영광"]],
[92,"하나님의 율법 (십계명)","하나님의 율법은 무엇입니까?","하나님께서 말씀하신 십계명입니다(출 20:1-17; 신 5:6-21).",["십계명"]],
[93,"두 돌판","이 계명들은 어떻게 나뉩니까?","두 돌판으로 나뉩니다. 첫째 돌판(1-4계명)은 하나님께 대해 어떻게 행할지, 둘째 돌판(5-10계명)은 이웃에게 어떤 의무가 있는지를 가르칩니다.",["두 돌판","하나님 사랑","이웃 사랑"]],
[94,"제1계명","제1계명에서 하나님은 무엇을 요구하십니까?","모든 우상 숭배와 마술, 미신, 성인이나 다른 피조물에게 기도하는 것을 피하고, 유일하신 참 하나님을 바르게 알며, 그분만 신뢰하고, 겸손과 인내로 모든 좋은 것을 그분께만 기대하며, 마음을 다해 사랑하고 경외하고 공경하라는 것입니다.",["1계명","우상","신뢰"]],
[95,"우상숭배란","우상 숭배란 무엇입니까?","말씀에 자신을 계시하신 유일하신 참 하나님 대신, 혹은 그분과 나란히 다른 무엇을 생각해 내거나 소유하여 그것을 신뢰하는 것입니다.",["우상숭배","신뢰"]],
[96,"제2계명","제2계명에서 하나님은 무엇을 요구하십니까?","어떤 형상으로도 하나님을 표현하지 말고, 그분이 말씀에서 명하신 방법 외에 다른 방법으로 예배하지 말라는 것입니다.",["2계명","예배","형상"]],
[97,"형상을 만들지 말라","그러면 어떤 형상도 만들면 안 됩니까?","하나님은 어떤 방법으로도 형상화될 수 없고 형상화되어서도 안 됩니다. 피조물은 형상화될 수 있지만 그것을 경배하거나 그것으로 하나님을 섬기려고 만들거나 가져서는 안 됩니다.",["형상","경배"]],
[98,"교회 안의 형상","평신도를 위한 책으로 교회에 형상을 두면 안 됩니까?","안 됩니다. 우리가 하나님보다 지혜로운 체해서는 안 됩니다. 하나님은 말 못 하는 우상이 아니라 살아 있는 말씀의 설교로 그분의 백성을 가르치기 원하십니다.",["설교","말씀"]],
[99,"제3계명","제3계명은 무엇을 요구합니까?","저주나 거짓 맹세, 불필요한 맹세로 하나님의 이름을 모독하거나 남용하지 말고, 침묵하여 그런 죄에 동참하지도 말며, 오직 두려움과 경외함으로 하나님의 이름을 사용하여 그분을 바르게 고백하고 부르며 모든 말과 행실로 영화롭게 하라는 것입니다.",["3계명","하나님의 이름"]],
[100,"묵인도 죄","저주와 맹세로 하나님의 이름을 모독하는 것이 그렇게 큰 죄입니까?","그렇습니다. 하나님의 이름을 모독하는 것보다 더 크게 하나님을 진노하게 하는 죄는 없습니다. 그러므로 힘을 다해 막지 않고 묵인하는 사람도 진노를 받습니다.",["모독","묵인"]],
[101,"경건한 맹세","하나님의 이름으로 경건하게 맹세할 수 있습니까?","그렇습니다. 국가가 요구하거나 필요한 경우, 신실함과 진실을 확증하여 하나님께 영광이 되고 이웃에게 유익이 되도록 하나님의 이름으로 맹세할 수 있습니다.",["맹세","진실"]],
[102,"피조물로 맹세하지 말라","성인이나 다른 피조물로 맹세해도 됩니까?","안 됩니다. 정당한 맹세는 마음을 아시는 유일한 하나님께 진실의 증인이 되어 주시고 거짓이면 벌해 달라고 부르는 것이므로, 그 영광을 어떤 피조물에게도 돌릴 수 없습니다.",["맹세","하나님의 영광"]],
[103,"제4계명","제4계명에서 하나님은 무엇을 요구하십니까?","첫째, 복음의 사역과 교육이 유지되고, 특히 안식일에 하나님의 교회에 부지런히 모여 말씀을 배우고 성례에 참여하며 주님께 공적으로 기도하고 구제하라는 것입니다. 둘째, 평생 악한 일을 쉬고 주께서 성령으로 내 안에서 일하시게 하여 영원한 안식을 이 생에서 시작하라는 것입니다.",["4계명","안식","예배"]],
[104,"제5계명","제5계명에서 하나님은 무엇을 요구하십니까?","부모와 내 위에 세워진 모든 사람에게 공경과 사랑과 신실함을 보이고, 그들의 선한 가르침과 징계에 순종하며, 그들의 약점을 인내하라는 것입니다. 하나님께서 그들의 손으로 우리를 다스리기 원하시기 때문입니다.",["5계명","권위","공경"]],
[105,"제6계명","제6계명에서 하나님은 무엇을 요구하십니까?","생각이나 말이나 몸짓이나 행동으로 이웃을 모욕하거나 미워하거나 해치거나 죽이지 말고, 복수심을 버리며, 나 자신도 해치지 말라는 것입니다. 정부는 살인을 막기 위해 칼을 가지고 있습니다.",["6계명","생명"]],
[106,"미움도 살인","이 계명은 살인만 말합니까?","살인을 금하심으로써 하나님은 그 뿌리인 시기, 미움, 분노, 복수심을 미워하시며 그것을 모두 살인으로 여기신다는 것을 가르치십니다.",["미움","분노","뿌리"]],
[107,"이웃 사랑의 명령","그런 식으로 이웃을 죽이지만 않으면 됩니까?","아닙니다. 이웃을 내 몸처럼 사랑하고, 인내와 화평과 온유와 자비와 친절로 대하며, 힘닿는 대로 해를 막고, 원수에게도 선을 행하라고 명하십니다.",["이웃 사랑","원수 사랑"]],
[108,"제7계명","제7계명은 무엇을 가르칩니까?","모든 부정함은 하나님께 저주받은 것이므로, 우리는 그것을 마음으로 미워하고 거룩한 결혼 생활에서든 독신 생활에서든 순결하고 절제하며 살아야 합니다.",["7계명","순결","결혼"]],
[109,"몸과 마음의 정결","이 계명은 간음 같은 추한 죄만 금합니까?","우리 몸과 영혼은 성령의 전이므로, 하나님은 우리가 둘 다 깨끗하고 거룩하게 지키기 원하십니다. 그래서 모든 부정한 행동과 몸짓과 말과 생각과 욕망, 그리고 그것으로 이끄는 모든 것을 금하십니다.",["성령의 전","정결"]],
[110,"제8계명","제8계명에서 하나님은 무엇을 금하십니까?","정부가 벌하는 도둑질과 강도질만이 아니라, 거짓 저울과 자, 속이는 상품, 위조 화폐, 고리대금 등 이웃의 재물을 내 것으로 만들려는 모든 속임수와 탐욕, 그리고 하나님의 선물을 낭비하는 것까지 금하십니다.",["8계명","탐욕","청지기"]],
[111,"이웃의 유익을 구함","이 계명에서 하나님은 무엇을 요구하십니까?","할 수 있는 대로 이웃의 유익을 증진하고, 내가 대접받고 싶은 대로 이웃을 대하며, 성실히 일하여 궁핍한 사람을 도울 수 있게 하라는 것입니다.",["이웃의 유익","구제","노동"]],
[112,"제9계명","제9계명은 무엇을 요구합니까?","누구에게도 거짓 증언하지 않고, 남의 말을 왜곡하지 않으며, 험담하거나 중상하지 않고, 경솔하게 정죄하지 않는 것입니다. 오히려 진리를 사랑하고 정직하게 말하며 이웃의 명예를 힘써 지키고 높여야 합니다.",["9계명","진실","명예"]],
[113,"제10계명","제10계명은 무엇을 요구합니까?","어떤 계명에라도 어긋나는 아주 작은 욕심이나 생각도 마음에 품지 말고, 언제나 진심으로 모든 죄를 미워하며 모든 의를 기뻐하라는 것입니다.",["10계명","마음","탐심"]],
[114,"완전히 지킬 수 있는가","하나님께 돌아온 사람은 이 계명을 완전히 지킬 수 있습니까?","아닙니다. 가장 거룩한 사람도 이 생에서는 순종의 작은 시작만 있을 뿐입니다. 그러나 그들은 진지한 결심으로 일부가 아니라 모든 계명을 따라 살기 시작합니다.",["순종의 시작","성화"]],
[115,"그래도 율법을 전하는 이유","아무도 지킬 수 없는데 왜 하나님은 십계명을 그렇게 엄하게 전하게 하십니까?","① 평생 우리의 죄된 본성을 더욱 깨달아 그리스도 안에서 죄 사함과 의를 더욱 간절히 구하게 하시려고, ② 성령의 은혜를 구하며 이 생을 마친 후 완전함에 이르기까지 하나님의 형상으로 점점 새로워지게 하시려고입니다.",["율법의 용도","겸손","성화"]],
[116,"기도가 필요한 이유","그리스도인에게 기도는 왜 필요합니까?","기도는 하나님께서 우리에게 요구하시는 감사의 가장 중요한 부분이기 때문입니다. 또한 하나님은 쉬지 않고 간절히 구하고 감사하는 사람에게만 은혜와 성령을 주십니다.",["기도","감사"]],
[117,"하나님이 들으시는 기도","하나님이 기뻐하시고 들으시는 기도는 어떤 것입니까?","① 말씀에 계시된 유일하신 참 하나님께, 그분이 구하라고 하신 모든 것을 진심으로 구하고, ② 우리의 궁핍과 비참을 철저히 알고 그분 앞에 겸손히 엎드리며, ③ 자격 없는 우리지만 그리스도 때문에 반드시 들으신다는 확신을 가지는 기도입니다.",["기도","겸손","확신"]],
[118,"무엇을 구하는가","하나님은 무엇을 구하라고 명하셨습니까?","영혼과 몸에 필요한 모든 것입니다. 그리스도께서 친히 가르치신 기도에 그것이 다 담겨 있습니다.",["필요","주기도"]],
[119,"주기도문","주님이 가르치신 기도는 무엇입니까?","'하늘에 계신 우리 아버지여…'로 시작하는 주기도문입니다(마 6:9-13; 눅 11:2-4). 부름, 여섯 간구, 송영으로 이루어집니다.",["주기도문"]],
[120,"우리 아버지","왜 '우리 아버지'라고 부르게 하셨습니까?","기도의 첫머리부터 하나님께 대한 어린아이 같은 경외와 신뢰를 일깨우시려는 것입니다. 하나님은 그리스도 때문에 우리 아버지가 되셨으므로, 우리 부모가 땅의 것을 거절하지 않는 것보다 더욱 우리가 믿음으로 구하는 것을 거절하지 않으십니다.",["아버지","신뢰"]],
[121,"하늘에 계신","왜 '하늘에 계신'이라는 말이 덧붙여 있습니까?","하나님의 하늘의 위엄을 땅의 것으로 생각하지 않고, 몸과 영혼에 필요한 모든 것을 그분의 전능하심에서 기대하게 하시려는 것입니다.",["위엄","전능"]],
[122,"첫째 간구: 이름","첫째 간구 '이름이 거룩히 여김을 받으시오며'는 무슨 뜻입니까?","주님을 바르게 알게 하시고, 주님의 모든 일에서 주님을 거룩히 여기고 찬양하게 하시며, 우리의 삶을 바르게 하여 주님의 이름이 우리 때문에 모독받지 않고 영광과 찬양을 받게 해 달라는 것입니다.",["하나님의 이름","영광"]],
[123,"둘째 간구: 나라","둘째 간구 '나라가 임하시오며'는 무슨 뜻입니까?","말씀과 성령으로 우리를 다스려 더욱 주님께 순종하게 하시고, 교회를 보존하고 흥왕하게 하시며, 마귀의 일과 주님을 대적하는 모든 세력을 멸하셔서, 주님이 만유의 주가 되시는 완전한 나라가 오게 해 달라는 것입니다.",["하나님 나라","교회","통치"]],
[124,"셋째 간구: 뜻","셋째 간구 '뜻이 하늘에서 이루어진 것 같이 땅에서도'는 무슨 뜻입니까?","우리와 모든 사람이 자기 뜻을 버리고 유일하게 선하신 주님의 뜻에 불평 없이 순종하게 하시고, 하늘의 천사들처럼 각자 자기 직분과 소명을 기꺼이 신실하게 감당하게 해 달라는 것입니다.",["하나님의 뜻","소명","순종"]],
[125,"넷째 간구: 양식","넷째 간구 '오늘 우리에게 일용할 양식을 주시옵고'는 무슨 뜻입니까?","몸에 필요한 모든 것을 주셔서, 주님만이 모든 좋은 것의 유일한 근원이시며 주님의 복 없이는 우리의 염려와 수고와 주님의 선물도 유익이 없음을 알게 하시고, 피조물이 아니라 주님만 신뢰하게 해 달라는 것입니다.",["일용할 양식","신뢰","섭리"]],
[126,"다섯째 간구: 용서","다섯째 간구 '우리 죄를 사하여 주시옵고'는 무슨 뜻입니까?","그리스도의 피 때문에 비참한 죄인인 우리의 모든 죄와 여전히 남아 있는 악을 돌리지 말아 달라는 것입니다. 주님의 은혜의 증거로 우리도 이웃을 진심으로 용서하기로 굳게 결심합니다.",["용서","은혜","이웃"]],
[127,"여섯째 간구: 시험","여섯째 간구 '시험에 들게 하지 마시옵고 다만 악에서 구하시옵소서'는 무슨 뜻입니까?","우리는 스스로 한순간도 설 수 없고, 마귀와 세상과 우리 육신이 쉬지 않고 공격합니다. 그러니 성령의 능력으로 붙드시고 강하게 하셔서 이 영적 싸움에서 패하지 않고 끝내 완전히 승리하게 해 달라는 것입니다.",["시험","영적 싸움","성령"]],
[128,"송영","기도를 어떻게 마칩니까?","'나라와 권세와 영광이 아버지께 영원히 있사옵나이다.' 주님은 만유의 왕이시므로 모든 좋은 것을 주실 뜻과 능력이 있으시기에 구하며, 그리하여 영광이 우리가 아니라 주님의 거룩한 이름에 영원히 돌아가게 하려는 것입니다.",["송영","영광"]],
[129,"아멘","'아멘'은 무슨 뜻입니까?","'참되고 확실하다'는 뜻입니다. 내가 마음으로 이것을 원한다고 느끼는 것보다 하나님께서 내 기도를 훨씬 더 확실히 들으십니다.",["아멘","확신"]]
];

  tip.innerHTML=o.items.map(([a,b,t,note])=>`<div><b>${a}문 ↔ ${b}문</b> · ${RT[t]}<br>${note}</div>`).join('<hr style="border:0;border-top:1px solid rgba(127,127,127,.4);margin:6px 0">');
  tip.classList.add("on");
  const tw=tip.offsetWidth,th=tip.offsetHeight;let x=cx-r.left+14,y=cy-r.top+14;if(x+tw>r.width-8)x=cx-r.left-tw-14;if(y+th>r.height-8)y=cy-r.top-th-14;tip.style.left=Math.max(8,x)+"px";tip.style.top=Math.max(8,y)+"px";
}
// 포인터: 드래그 이동, 핀치 확대, 클릭 판정
const pts=new Map();let moved=0,downT=null,pinch=null;
svg.addEventListener("pointerdown",e=>{svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;downT=e.target;camTo=null;
  if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};}});
svg.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId)){const h=e.target.closest&&e.target.closest(".relhit");if(h){showTip(h._rel,e.clientX,e.clientY);h.nextSibling.classList.add("hov");}return;}
  const p=pts.get(e.pointerId);const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(pts.size===2&&pinch){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt((a.x+b.x)/2,(a.y+b.y)/2,d/pinch.d);pinch.d=d;moved+=99;return;}
  moved+=Math.abs(dx)+Math.abs(dy);if(moved>5){svg.classList.add("drag");cam.x+=dx;cam.y+=dy;draw();closeTip();}
});
svg.addEventListener("pointerout",e=>{const h=e.target.closest&&e.target.closest(".relhit");if(h){closeTip();h.nextSibling.classList.remove("hov");}});
const endPtr=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);if(pts.size<2)pinch=null;svg.classList.remove("drag");
  if(e.type==="pointerup"&&moved<=5&&pts.size===0&&downT){
    const nd=downT.closest(".node");const rh=downT.closest(".relhit");
    if(nd)select(nd.dataset.id,{toggle:true});
    else if(rh){const o=rh._rel;showTip(o,e.clientX,e.clientY);}
    else closeTip();
  }downT=null;};
svg.addEventListener("pointerup",endPtr);svg.addEventListener("pointercancel",endPtr);
svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0016)));},{passive:false});
document.getElementById("zIn").onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.25);};
document.getElementById("zOut").onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,.8);};

  else if(e.key==="ArrowRight"||e.key==="ArrowLeft"){const d=e.key==="ArrowRight"?1:-1;

const qIn=document.getElementById("q"),res=document.getElementById("results");let resAct=0,resList=[];
qIn.addEventListener("input",()=>{
  const s=qIn.value.trim();matches=new Set();resList=[];
  if(s){const num=/^\d+$/.test(s)?+s:null;const bc=s.match(/^([가-힣]+)\s*(\d+)$/);
    QS.forEach(([n,t,q,a,k])=>{const ldt=LD_TITLE[Q2LD[n]-1];
      const hit=num?n===num:bc?(REFS[n]||[]).some(r=>r.book===bc[1]&&r.ch===+bc[2]):(t+q+a+k.join(" ")+ldt+" "+(BIBLE[n]||"")).includes(s);
      if(hit){matches.add(n);resList.push(n);}});}
  resAct=0;drawRes();render(null,200);
});
function drawRes(){
  if(!qIn.value.trim()){res.classList.remove("on");return;}
  res.innerHTML=resList.length?resList.slice(0,30).map((n,i)=>`<button data-q="${n}" class="${i===resAct?"act":""}"><b>${n}문</b>${QM[n].t}<small>제${Q2LD[n]}주일 · ${QM[n].q}</small></button>`).join("")+(resList.length>30?`<button disabled><small>…외 ${resList.length-30}개 (지도에 점선으로 표시)</small></button>`:""):`<button disabled><small>결과 없음</small></button>`;
  res.classList.add("on");
}
qIn.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){resAct=Math.min(resAct+1,Math.min(resList.length,30)-1);drawRes();e.preventDefault();}
  else if(e.key==="ArrowUp"){resAct=Math.max(resAct-1,0);drawRes();e.preventDefault();}
  else if(e.key==="Enter"&&resList.length){goTo("Q"+resList[resAct]);res.classList.remove("on");}
  else if(e.key==="Escape"){qIn.value="";qIn.dispatchEvent(new Event("input"));qIn.blur();}
});

const VKEY="hc-verses";

function importVerses(text){
  const s=text.indexOf("{"),e=text.lastIndexOf("}");
  const obj=JSON.parse(text.slice(s,e+1));
  if(!obj||typeof obj!=="object"||!obj["롬 8:28"])throw new Error("형식이 맞지 않음");
  VERSES=obj;
  try{localStorage.setItem(VKEY,JSON.stringify(obj));return true;}catch(err){return false;}
}
const verseHtml=txt=>{const vs=VERSES&&VERSES[txt];if(!vs||!vs.length)return "";return vs.map(([v,t])=>`<sup>${v}</sup>${t}`).join(" ");};
function refRow(q){const rs=REFS[q];if(!rs||!rs.length)return "";
  return `<div class="refs"><span class="rl">성경 근거</span>${rs.map(r=>`<button class="ref" data-ref="${r.book} ${r.ch}" data-v="${r.v}" data-txt="${r.txt}" aria-haspopup="true">${r.txt}</button>`).join("")}
  ${VERSES?`<button class="ref-all" data-allrefs="${q}" aria-expanded="false">본문 펼치기</button>`:""}</div>
  ${VERSES?`<div class="vlist" id="vl-${q}" hidden>${rs.map(r=>`<p><b>${r.txt}</b> ${verseHtml(r.txt)}</p>`).join("")}<small class="vsrc">개역개정</small></div>`:""}`;}

    `<div class="pager">${q>1?`<button class="btn" data-go="Q${q-1}">← ${q-1}문</button>`:"<span></span>"}${q<129?`<button class="btn" data-go="Q${q+1}">${q+1}문 →</button>`:""}</div>`;
  }
  pbody.innerHTML=h;pbody.scrollTop=0;panel.scrollTop=0;
  const gt=n.type==="root"?`하이델베르크 요리문답<small>${sheet==="min"?"올려서 사용법 보기":""}</small>`:n.type==="q"?`${n.qn}문 ${QM[n.qn].t}<small>제${Q2LD[n.qn]}주일</small>`:n.type==="ld"?`제${n.ld}주일 · ${LD_TITLE[n.ld-1]}<small>${qRangeTxt(n.ld)}</small>`:`${n.label}<small>${n.sub}</small>`;
  document.getElementById("grabTitle").innerHTML=gt;
}
